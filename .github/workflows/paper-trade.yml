name: Prices & forward test

# Every 15 minutes: refresh the prices the app shows, and run the forward test.
#
# WHY THE CLOUD FETCHES PRICES INSTEAD OF THE APP
#   Measured on the network this app is actually used on, every major crypto
#   exchange fails DNS resolution — api.binance.com, data-api.binance.vision,
#   api.exchange.coinbase.com, api.coinbase.com and api.kraken.com — while
#   Yahoo, GitHub and Supabase resolve normally. Selective ISP-level blocking.
#   So an app calling an exchange directly would simply fail there. GitHub
#   runners reach the exchanges fine, and Supabase reaches everyone, so the
#   runner fetches and Supabase relays. The app talks to Supabase and nothing
#   else — no keys, no CORS, works on a filtered connection.
#
# WHY 15 MINUTES
#   Long enough for a full ingest cycle to finish (the interval MUST exceed the
#   run time — cancel-in-progress means a slow run gets killed by its
#   successor, which is exactly how push-snapshot.yml silently stopped
#   updating). Short enough that prices are minutes old rather than hours.
#
# WHAT THIS DOES NOT DO
#   It never rewrites predictions or track records. A full `push` rebuilds every
#   model and needs the eval_runs table, which the ephemeral runner does not
#   have; refresh-markets.yml does that once a day. `prices` patches only the
#   price fields, so a fresher price can never be mistaken for a fresher
#   forecast — the app's staleness guard still reports the forecast window as
#   closed while the price ticks.

on:
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch: {}

concurrency:
  group: paper-trade
  cancel-in-progress: true

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 14 # below the 15-minute interval, by design
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy scipy requests python-dotenv scikit-learn yfinance

      - name: Show what commit we're running
        run: git rev-parse --short HEAD

      # 5m gives the freshest price; 1h is the horizon being forward-tested and
      # settles the previous run's forecasts. Crypto falls back to Coinbase
      # automatically when Binance geo-blocks the US-hosted runner.
      - name: Ingest crypto
        env:
          PYTHONPATH: src
        run: python -m markets_model.main ingest-crypto --timeframes 5m 1h --bars 500 || true

      - name: Ingest FX / stocks / indices / commodities
        env:
          PYTHONPATH: src
        run: python -m markets_model.main ingest-yahoo --timeframes 5m 1h

      - name: Refresh prices in the published snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONPATH: src
        run: python -m markets_model.main prices

      # resolve -> log -> publish. Resolving first uses the bars just ingested to
      # grade the previous run, so one job is a complete cycle. Logging is
      # idempotent on (symbol, timeframe, horizon, cutoff, model), so running
      # four times an hour still records exactly one forecast per hourly bar.
      - name: Resolve, log, and publish the forward-test record
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONPATH: src
        run: python -m markets_model.main paper --timeframes 1h
