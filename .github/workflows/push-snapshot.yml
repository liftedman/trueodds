name: Push snapshot

# Keeps the app fresh: rebuilds the prediction snapshot (ratings + live
# fixtures/scores + news) and pushes it to Supabase on a schedule. The app's
# 60s auto-refresh then picks up the new data automatically.

on:
  schedule:
    # Every 15 minutes, NOT the 5 that this used to be.
    #
    # The interval must exceed how long a run actually takes, because
    # cancel-in-progress below means each scheduled run kills the one before it.
    # Building the snapshot now takes ~4.5 minutes (measured 258s: the models are
    # refitted from scratch every run, and the payload has grown past 1MB as
    # leagues were added). Add checkout and dependency install and a run no
    # longer fits inside 5 minutes, so every run was being cancelled by its
    # successor and the snapshot silently stopped updating.
    #
    # If the build is ever made faster, this can come back down. Whatever it is,
    # keep it comfortably above the real run time.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # adds a manual "Run workflow" button

# A newer run supersedes an older still-running one, so a slow/stale run can't
# finish late and overwrite fresher data. Correct, but it is what makes the
# interval above load-bearing — see the note there before shortening it.
concurrency:
  group: push-snapshot
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # no pip cache: avoids ever installing a stale cached build of the package

      - name: Install dependencies
        run: pip install pandas numpy scipy requests python-dotenv scikit-learn nba_api

      - name: Show what commit we're running
        run: git rev-parse --short HEAD

      - name: Build & push snapshot (from the fresh checkout, not an installed copy)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          PYTHONPATH: src
        run: python -m sports_model.main push
